apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: resultserver-deploy
  name: resultserver-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app:  resultserver-deploy
  template:
    metadata:
      labels:
        app: resultserver-deploy
    spec:
      containers:
      - image: rcpmrl-dev/my-backend-image-build
        name: resultserver
        ports:
        - containerPort: 80
        env:
          - name: MYSQL_DATABASE_HOST
            value: mysql
          - name: MYSQL_PASSWORD
            value: Clarusway_1
          - name: MYSQL_USER
            value: clarus
          - name: MYSQL_DATABASE
            value: phonebook
        resources: {}
